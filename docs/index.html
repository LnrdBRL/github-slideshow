<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koine Greek Trainer</title>
<meta name="description" content="Frequency-first, spaced-repetition trainer for reading the Greek New Testament.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --card:#fffdf8; --ink:#1f1b16; --muted:#6d6457; --line:#e3dccf;
  --accent:#7a2e1d; --accent-soft:#f3e4dc; --good:#2f6b3a; --bad:#a3262a; --warn:#9a6a00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --card:#211d18; --ink:#efe8dc; --muted:#a89d8c; --line:#3a332a;
    --accent:#e0906f; --accent-soft:#3a251d; --good:#7cc287; --bad:#ef7b7e; --warn:#e2b44d;
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --card:#211d18; --ink:#efe8dc; --muted:#a89d8c; --line:#3a332a;
  --accent:#e0906f; --accent-soft:#3a251d; --good:#7cc287; --bad:#ef7b7e; --warn:#e2b44d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
.gk{font-family:"Gentium Book Plus","Noto Serif",serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
.brand{font-weight:600;letter-spacing:.02em}
.brand .gk{font-size:1.3em;color:var(--accent);margin-right:6px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav button{flex:none}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--accent)}
button.on,button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button.ghost{background:transparent}
main{padding:20px 0 80px}
h2{margin:.2em 0 .6em;font-size:1.35rem}
h3{margin:1.2em 0 .4em;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.6rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.flash{text-align:center;padding:28px 16px}
.flash .big{font-size:2.6rem;line-height:1.2}
.flash .gloss{font-size:1.25rem;margin-top:14px}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.answers button{padding:12px 6px}
.a-again{border-color:var(--bad)!important;color:var(--bad)}
.a-good{border-color:var(--good)!important;color:var(--good)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.opts button{padding:12px}
.opts button.right{background:var(--good);color:var(--bg);border-color:var(--good)}
.opts button.wrong{background:var(--bad);color:var(--bg);border-color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:var(--accent-soft);font-weight:600}
td.gk{font-size:1.15rem}
td.hl{background:var(--accent);color:var(--bg)}
.tablewrap{overflow-x:auto}
.verse{font-size:1.45rem;line-height:2.1;margin:8px 0}
.verse sup{font-family:Inter,sans-serif;font-size:.7rem;color:var(--muted);margin-right:4px}
.w{cursor:pointer;border-radius:5px;padding:0 2px;display:inline-block}
.w:hover,.w.sel{background:var(--accent-soft)}
.inter .w{display:inline-flex;flex-direction:column;align-items:center;margin:0 4px 10px;vertical-align:top;line-height:1.3}
.inter .w small{font-family:Inter,sans-serif;font-size:.7rem;color:var(--muted);max-width:110px;text-align:center}
.w small{display:none}.inter .w small{display:block}
.panel{position:sticky;bottom:12px;margin-top:14px;border-color:var(--accent)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.letter{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.letter .gk{font-size:2rem}
input[type=number],select,input[type=text]{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.list td{vertical-align:top}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line)}
.dot.l1{background:var(--bad)}.dot.l2{background:var(--warn)}.dot.l3{background:var(--good)}
.hide{display:none!important}
@media (max-width:560px){
  .answers{grid-template-columns:1fr 1fr}
  .opts{grid-template-columns:1fr}
  .flash .big{font-size:2.1rem}
  .verse{font-size:1.25rem}
}
</style>
</head>

   ========================================================= */
const CASES=["Nom","Gen","Dat","Acc"];
function nounTable(id,title,info,sg,pl,voc){
  const cells=[];CASES.forEach((c,i)=>{cells.push({form:sg[i],label:c+" sg",r:i,c:0});cells.push({form:pl[i],label:c+" pl",r:i,c:1});});
  const rows=[...CASES]; if(voc){rows.push("Voc");cells.push({form:voc[0],label:"Voc sg",r:4,c:0});cells.push({form:voc[1],label:"Voc pl",r:4,c:1});}
  return {id,title,info,group:"Nouns",drill:id,rows,cols:["Singular","Plural"],cells};
}
function verbTable(id,title,info,drill,prefix,forms,group="Verbs"){
  const P=["1st","2nd","3rd"],cells=[];
  forms.forEach((f,i)=>cells.push({form:f,label:`${prefix} ${P[i%3]} ${i<3?"sg":"pl"}`,r:i%3,c:i<3?0:1}));
  return {id,title,info,group,drill,rows:P,cols:["Singular","Plural"],cells};

const KEY="koine-trainer-v1";
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);};
const INTERVALS=[0,1,2,4,8,16,32,64,128,256];
let S=load();
function load(){
  let s=null; try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  return Object.assign({cards:{},newPerDay:15,introduced:{},streak:{last:null,count:0},checks:{},drill:{right:0,total:0},reverse:false},s||{});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function touchStreak(){const t=today();if(S.streak.last===t)return;S.streak.count=(S.streak.last===t-1)?S.streak.count+1:1;S.streak.last=t;save();}

const cardOf=i=>S.cards[i];
function learnedIdx(minBox=3){return VOCAB.map((_,i)=>i).filter(i=>S.cards[i]&&S.cards[i].box>=minBox);}
function coverage(minBox=3){const sum=learnedIdx(minBox).reduce((a,i)=>a+VOCAB[i][2],0);return sum/NT_WORDS*100;}
function dueList(){const t=today();return VOCAB.map((_,i)=>i).filter(i=>S.cards[i]&&S.cards[i].due<=t);}
function newAvailable(){const t=today(),done=S.introduced[t]||0;const left=Math.max(0,S.newPerDay-done);return VOCAB.map((_,i)=>i).filter(i=>!S.cards[i]).slice(0,left);}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function speak(text){
  try{const u=new SpeechSynthesisUtterance(text.split(",")[0].replace(/[-()]/g,""));u.lang="el-GR";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}

      ${revealed?"":`<button class="primary" id="show" style="margin:0 auto">Show answer <span class="muted small">(space)</span></button>`}
    </div>
    ${revealed?`<div class="answers">
      <button class="a-again" data-g="0">Again<br><span class="small muted">1</span></button>
      <button data-g="1">Hard<br><span class="small muted">2</span></button>
      <button class="a-good" data-g="2">Good<br><span class="small muted">3</span></button>
      <button data-g="3">Easy<br><span class="small muted">4</span></button></div>`:""}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="ghost small" id="say">🔊 Listen</button><span class="muted small">${queue.length} left in this session</span></div>
  </div>
  <p class="muted small">Grade yourself honestly. "Again" means you did not get it instantly; the word comes back this session.</p>`;
  bindVocabHead();
  const sh=$("#show"); if(sh)sh.onclick=()=>{revealed=true;viewVocab();};
  $("#say").onclick=()=>speak(v[0]);
  $("#app").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
}
function bindVocabHead(){
  $("#rev").onclick=()=>{S.reverse=!S.reverse;save();revealed=false;viewVocab();};
  $("#lst").onclick=()=>{vocabMode="list";viewVocab();};
}
function grade(g){
  const t=today();let c=S.cards[cur];
  if(!c){c=S.cards[cur]={box:0,due:t,reps:0,lapses:0};S.introduced[t]=(S.introduced[t]||0)+1;}
  c.reps++;
  if(g===0){c.lapses++;c.box=Math.max(0,c.box>1?1:0);c.due=t;queue.splice(Math.min(3,queue.length),0,cur);}
  else{c.box=Math.min(INTERVALS.length-1,c.box+(g===1?0:g===2?1:2));if(g===1&&c.box===0)c.box=1;c.due=t+Math.max(1,INTERVALS[c.box]);}
  touchStreak();save();cur=queue.shift();revealed=false;viewVocab();
}
document.addEventListener("keydown",e=>{
  if(tab!=="vocab"||vocabMode!=="study"||e.target.tagName==="INPUT")return;
  if(e.code==="Space"&&!revealed&&cur!==undefined){e.preventDefault();revealed=true;viewVocab();}
  else if(revealed&&["1","2","3","4"].includes(e.key))grade(+e.key-1);
});
function viewVocabList(){
  let cum=0;
  const rows=VOCAB.map((v,i)=>{cum+=v[2];const c=S.cards[i];const lvl=!c?"":c.box>=3?"l3":c.box>=1?"l2":"l1";
    return `<tr><td class="muted">${i+1}</td><td class="gk" style="font-size:1.1rem"><span class="dot ${lvl}"></span>${esc(v[0])}</td><td>${esc(v[1])}</td><td class="muted">${v[2].toLocaleString()}</td><td class="muted">${(cum/NT_WORDS*100).toFixed(1)}%</td></tr>`;}).join("");
  $("#app").innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Word list (by frequency)</h2><button class="small" id="back">← Study</button></div>
  <div class="card small"><span class="dot l3"></span>solid <span class="dot l2" style="margin-left:12px"></span>learning <span class="dot l1" style="margin-left:12px"></span>new/lapsed <span class="dot" style="margin-left:12px"></span>not started
  <div class="row" style="margin-top:12px">
    <button class="small" id="exp">Export progress</button>
    <label class="small"><input type="file" id="imp" accept=".json" class="hide"><span style="cursor:pointer;text-decoration:underline">Import progress</span></label>
    <span class="muted">Progress lives in this browser only. Export it now and then as a backup.</span></div></div>
  <div class="tablewrap"><table class="list"><thead><tr><th>#</th><th>Greek</th><th>Meaning</th><th>NT ×</th><th>Cumulative</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="muted small">Occurrence counts are approximate. They follow the standard NT frequency lists (e.g. Mounce), and different editions differ by a few occurrences.</p>`;
  $("#back").onclick=()=>{vocabMode="study";viewVocab();};
  $("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="koine-progress.json";a.click();};
  $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign(load(),JSON.parse(t));save();alert("Progress imported.");viewVocabList();}catch(err){alert("That file could not be read.");}});};
}

/* =========================================================
   FORMS — paradigm charts + recognition drill
   ========================================================= */
let formSel="art",drillQ=null,drillMode="drill",streakRun=0;
function tableHTML(p,hlLabel){
  const grid=p.rows.map(()=>p.cols.map(()=>""));
  p.cells.forEach(c=>grid[c.r][c.c]=c);
  return `<div class="tablewrap"><table><thead><tr><th></th>${p.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${
    p.rows.map((r,ri)=>`<tr><th>${r}</th>${grid[ri].map(c=>`<td class="gk ${c&&hlLabel&&hlLabel.includes(c.label)?"hl":""}">${c?esc(c.form):""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function drillPool(){const p=PARADIGMS.find(x=>x.id===formSel);return PARADIGMS.filter(x=>x.drill===p.drill);}
function newQ(){
  const pool=drillPool(),all=pool.flatMap(p=>p.cells.map(c=>Object.assign({p},c)));
  const q=all[Math.floor(Math.random()*all.length)];
  const valid=all.filter(c=>c.form===q.form).map(c=>c.label);
  const labels=[...new Set(all.map(c=>c.label))].filter(l=>!valid.includes(l));
  const key=q.label.split(" ").slice(0,-2).join(" "); // shared prefix → harder distractors
  const near=shuffle(labels.filter(l=>l.startsWith(key))),far=shuffle(labels.filter(l=>!l.startsWith(key)));
  const opts=shuffle([q.label,...[...near.slice(0,2),...far].slice(0,3)]);
  drillQ={q,valid,opts,answered:null,t0:Date.now()};
}
function viewForms(){
  const p=PARADIGMS.find(x=>x.id===formSel);
  const groups=[...new Set(PARADIGMS.map(x=>x.group))];
  const sel=`<select id="fsel">${groups.map(g=>`<optgroup label="${g}">${PARADIGMS.filter(x=>x.group===g).map(x=>`<option value="${x.id}" ${x.id===formSel?"selected":""}>${esc(x.title)}</option>`).join("")}</optgroup>`).join("")}</select>`;
  let body="";
  if(drillMode==="study"){
    body=`<div class="card"><h3 style="margin-top:0">${esc(p.title)}</h3><p class="muted">${esc(p.info)}</p>${tableHTML(p)}</div>`;
  }else{
    if(!drillQ||drillQ.poolId!==p.drill){newQ();drillQ.poolId=p.drill;}
    const d=drillQ;
    body=`<div class="card flash">
      <div class="muted small">Parse this form ${d.q.p.drill==="verb"?"(the verb is λύω)":"("+esc(d.q.p.title.split("—").pop().trim())+")"}</div>
      <div class="big gk" style="margin-top:8px">${esc(d.q.form)}</div>
      <div class="opts">${d.opts.map(o=>`<button data-o="${esc(o)}" class="${d.answered?(d.valid.includes(o)?"right":(o===d.answered?"wrong":"")):""}">${esc(o)}</button>`).join("")}</div>
      ${d.answered?`<div style="margin-top:16px">${d.valid.includes(d.answered)?`<b style="color:var(--good)">Correct</b>`:`<b style="color:var(--bad)">Not quite.</b> It's <b>${esc(d.valid.join(" or "))}</b>`}
        ${d.valid.length>1?`<p class="muted small">This form is ambiguous; in a real text the context decides.</p>`:""}
        <div style="margin-top:12px">${tableHTML(d.q.p,d.valid)}</div>
        <button class="primary" id="next" style="margin-top:14px">Next <span class="small">(Enter)</span></button></div>`:""}
      <p class="muted small" style="margin-top:14px">Run: ${streakRun} in a row · overall ${S.drill.total?Math.round(S.drill.right/S.drill.total*100):0}% of ${S.drill.total}</p>
    </div>`;
  }
  $("#app").innerHTML=`<h2>Forms</h2>
   <div class="row" style="margin-bottom:12px">${sel}
     <button class="small ${drillMode==="drill"?"on":""}" id="mDrill">Drill</button><button class="small ${drillMode==="study"?"on":""}" id="mStudy">Chart</button></div>
   ${body}
   <p class="muted small">How to use this: look at the chart, chant it out loud 3 times, then drill until you get 10 in a row. Do one chart a day, and come back to old ones.</p>`;
  $("#fsel").onchange=e=>{formSel=e.target.value;drillQ=null;streakRun=0;viewForms();};
  $("#mDrill").onclick=()=>{drillMode="drill";viewForms();};
  $("#mStudy").onclick=()=>{drillMode="study";viewForms();};
  $("#app").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answerQ(b.dataset.o));
  const n=$("#next"); if(n){n.onclick=()=>{newQ();drillQ.poolId=p.drill;viewForms();};n.focus();}
}
function answerQ(o){
  if(drillQ.answered)return;drillQ.answered=o;const ok=drillQ.valid.includes(o);
  S.drill.total++;if(ok){S.drill.right++;streakRun++;}else streakRun=0;touchStreak();save();viewForms();
}
document.addEventListener("keydown",e=>{if(tab==="forms"&&e.key==="Enter"&&drillQ&&drillQ.answered){e.preventDefault();const p=PARADIGMS.find(x=>x.id===formSel);newQ();drillQ.poolId=p.drill;viewForms();}});

/* =========================================================
   READ — tap-to-parse reader
   ========================================================= */
let passSel="jn1",inter=false,showTr=false,selW=null;
function viewRead(){
  const P=PASSAGES.find(x=>x.id===passSel);
  const verses=Object.entries(P.verses).map(([n,ws])=>`<div class="verse gk"><sup>${n}</sup>${ws.map((w,i)=>`<span class="w ${selW===n+"-"+i?"sel":""}" data-w="${n}-${i}">${esc(w[0])}<small>${esc(w[2])}</small></span>`).join(" ")}</div>
    ${showTr?`<p class="muted small" style="margin-top:-4px">${esc(P.translation[n])}</p>`:""}`).join("");
  let panel="";
  if(selW){const [n,i]=selW.split("-");const w=P.verses[n][+i];
    const inDeck=VOCAB.findIndex(v=>v[0].split(",")[0].trim()===w[1]);
    panel=`<div class="card panel">
      <div class="row" style="justify-content:space-between"><span class="gk" style="font-size:1.6rem">${esc(w[0].replace(/[.,·;]$/,""))}</span><button class="ghost small" id="say">🔊</button></div>
      <div><b>Lexical form:</b> <span class="gk" style="font-size:1.15rem">${esc(w[1])}</span> · <b>Meaning:</b> ${esc(w[2])}</div>
      <div><b>Parsing:</b> ${esc(w[3])}</div>
      ${w[4]?`<p style="margin:8px 0 0" class="small">💡 ${esc(w[4])}</p>`:""}
      <p class="muted small" style="margin:6px 0 0">${inDeck>=0?`Word #${inDeck+1} in your deck (×${VOCAB[inDeck][2]} in NT)`:"Not in the core deck: a lower-frequency word"}</p></div>`;
  }
  $("#app").innerHTML=`<h2>Read</h2>
  <div class="row" style="margin-bottom:12px">
    <select id="psel">${PASSAGES.map(x=>`<option value="${x.id}" ${x.id===passSel?"selected":""}>${x.title}</option>`).join("")}</select>
    <button class="small ${inter?"on":""}" id="tInter">Interlinear</button>
    <button class="small ${showTr?"on":""}" id="tTr">Translation</button></div>
  <div class="card ${inter?"inter":""}">${verses}</div>
  ${P.note?`<p class="muted small">📜 ${esc(P.note)}</p>`:""}
  ${panel||`<p class="muted small">Tap any word to see how it's parsed. First pass: use the help. Second pass: turn off Interlinear and try to parse every word before you tap it.</p>`}`;
  $("#psel").onchange=e=>{passSel=e.target.value;selW=null;viewRead();};
  $("#tInter").onclick=()=>{inter=!inter;viewRead();};
  $("#tTr").onclick=()=>{showTr=!showTr;viewRead();};
  $("#app").querySelectorAll("[data-w]").forEach(s=>s.onclick=()=>{selW=s.dataset.w;viewRead();});
  const sy=$("#say");if(sy)sy.onclick=()=>{const [n,i]=selW.split("-");speak(P.verses[n][+i][0]);};
}

/* =========================================================
   ALPHABET
   ========================================================= */
let alphaQ=null;
function viewAlpha(){
  if(!alphaQ){const i=Math.floor(Math.random()*24);alphaQ={i,opts:shuffle([i,...shuffle([...Array(24).keys()].filter(x=>x!==i)).slice(0,3)]),ans:null};}
  const a=alphaQ;
  $("#app").innerHTML=`<h2>Alphabet & pronunciation</h2>
  <div class="card flash"><div class="muted small">Which letter is this?</div><div class="big gk">${ALPHABET[a.i][0].split(" ").slice(1).join(" ")}</div>
    <div class="opts">${a.opts.map(o=>`<button data-a="${o}" class="${a.ans!==null?(o===a.i?"right":(o===a.ans?"wrong":"")):""}">${ALPHABET[o][1]} (${ALPHABET[o][2]})</button>`).join("")}</div>
    ${a.ans!==null?`<button class="primary" id="an" style="margin-top:14px">Next</button>`:""}</div>
  <div class="letters">${ALPHABET.map(l=>`<div class="letter"><div class="gk">${l[0]}</div><b>${l[1]}</b><div class="small muted">${l[2]} — ${l[3]}</div></div>`).join("")}</div>
  <h3>Diphthongs</h3><div class="letters">${DIPH.map(d=>`<div class="letter"><div class="gk">${d[0]}</div><div class="small muted">${d[1]} — ${d[2]}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:14px"><b>Marks</b>
   <p><span class="gk" style="font-size:1.3rem">ἁ</span> rough breathing = an "h" sound (ἁμαρτία → <i>hamartia</i>). <span class="gk" style="font-size:1.3rem">ἀ</span> smooth breathing = no sound.</p>
   <p><span class="gk" style="font-size:1.3rem">ᾳ ῃ ῳ</span> iota subscript: silent, but it often marks the <b>dative</b> (λόγῳ, ἀρχῇ). Watch for it.</p>
   <p><span class="gk" style="font-size:1.3rem">ά ὰ ᾶ</span> accents mark the stressed syllable, and sometimes tell two words apart (τίς "who?" vs τις "someone").</p>
   <p class="muted small">Pronunciation here is <b>Erasmian</b>, the standard academic system (and close to how you'd read it as a German or Italian speaker). The 🔊 button uses your device's modern Greek voice, which differs from it: η, ι, υ, ει, οι all sound like "i".</p></div>`;
  $("#app").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(a.ans===null){a.ans=+b.dataset.a;viewAlpha();}});
  const n=$("#an");if(n)n.onclick=()=>{alphaQ=null;viewAlpha();};
}

/* =========================================================
   METHOD
   ========================================================= */
function viewMethod(){
  $("#app").innerHTML=`<h2>The method</h2>
  <div class="card"><p>There is no secret spy trick. What the US government language schools (the CIA's language school, the State Department's FSI, the military's DLI) do is <b>intensive, structured and relentless</b>: lots of time on task, the most useful material first, constant testing, and real texts early. This trainer copies that structure.</p></div>
  <div class="card"><h3 style="margin-top:0">1 · Frequency first</h3><p>Around 310 words make up roughly 80% of the words in the NT text. Learn them in order of frequency and you can read real verses within weeks.</p>
  <h3>2 · Spaced repetition</h3><p>Each card comes back just before you would forget it (1 → 2 → 4 → 8 → 16… days). Ten to fifteen minutes a day beats two hours on a Sunday.</p>
  <h3>3 · Drill the forms until they're automatic</h3><p>Greek packs its meaning into word endings. Military schools drill these patterns until you recognise them without thinking. The Forms tab does that: recognising a form in under 2 seconds is the goal.</p>
  <h3>4 · Read real text from day one</h3><p>Read real, understandable text with help. Start with John's Gospel and 1 John: they use the simplest vocabulary in the NT.</p>
  <h3>5 · Say it out loud</h3><p>Read aloud, chant the charts, explain a verse to someone. Producing the language beats only recognising it.</p></div>
  <div class="card"><h3 style="margin-top:0">A 12-week plan</h3>
  <table><tr><th>Weeks</th><th>Focus</th><th>Milestone</th></tr>
  <tr><td>1</td><td>Alphabet, pronunciation, article, words 1–60</td><td>Read John 1:1 aloud and parse it</td></tr>
  <tr><td>2–3</td><td>2nd & 1st declension, εἰμί, present active, words 60–150</td><td>John 1:1–5 without help</td></tr>
  <tr><td>4–5</td><td>3rd declension, pronouns, imperfect, future</td><td>1 John 1 with a reader's lexicon</td></tr>
  <tr><td>6–8</td><td>Aorist (active/passive), middle voice, words 150–230</td><td>John 3:16 and 1 John 4 without help</td></tr>
  <tr><td>9–12</td><td>Participles, subjunctive, infinitives</td><td>Read a chapter of John a week</td></tr></table>
  <p class="muted small">After this you need a proper grammar for the rest of the forms (participle charts, μι-verbs, contract verbs).</p></div>
  <div class="card"><h3 style="margin-top:0">Recommended companions</h3>
  <p>• <b>Mounce, <i>Basics of Biblical Greek</i></b>: the standard grammar, and the frequency order used here.<br>
  • <b>A reader's Greek New Testament</b> (rare words glossed at the foot of the page). This is your next step after the core vocabulary.<br>
  • <b>SBLGNT or NA28</b> for the text itself. SBLGNT is free online.<br>
  • <b>BDAG</b>, the standard lexicon, when one-line glosses aren't enough.</p></div>
  <p class="muted small">Accuracy: the charts and parsings follow standard Koine grammar. The frequency counts are approximate and differ by a few occurrences between editions. If something looks off, check it against Mounce or BDAG.</p>`;
}

render();
</script>
</body>
</html>
