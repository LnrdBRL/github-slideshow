<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koine Greek Trainer</title>
<meta name="description" content="Learn to read the Greek New Testament: frequency-first vocabulary, form drills, the whole SBLGNT with parsing, and Strong's.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Black and gold: one committed dark look. */
  --bg:#0b0a08; --card:#14120e; --ink:#ece4d2; --muted:#9b907a; --line:#2c271d;
  --accent:#c9a54c; --accent-soft:#241e12; --good:#8fbf7f; --bad:#e07a6e; --warn:#d9b45a;
  --serif:"Times New Roman",Times,"Crimson Pro",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
b,strong,th{font-weight:600}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--serif)}
.gk{font-family:"Gentium Book Plus","Noto Serif",serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;color:var(--ink)}
.logo{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--accent);border-radius:50%;color:var(--accent);font-size:1.15rem;letter-spacing:.02em;text-transform:none}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav button{flex:none}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;letter-spacing:.01em}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:hover{border-color:var(--accent)}
button.on,button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button.ghost{background:transparent}
main{padding:20px 0 80px}
h2{margin:.2em 0 .6em;font-size:1.6rem;font-weight:400;letter-spacing:.01em;color:var(--accent)}
h3{margin:1.2em 0 .4em;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.6rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.flash{text-align:center;padding:28px 16px}
.flash .big{font-size:2.6rem;line-height:1.2}
.flash .gloss{font-size:1.25rem;margin-top:14px}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.answers button{padding:12px 6px}
.a-again{border-color:var(--bad)!important;color:var(--bad)}
.a-good{border-color:var(--good)!important;color:var(--good)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.opts button{padding:12px}
.opts button.right{background:var(--good);color:var(--bg);border-color:var(--good)}
.opts button.wrong{background:var(--bad);color:var(--bg);border-color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:var(--accent-soft);font-weight:600}
td.gk{font-size:1.15rem}
td.hl{background:var(--accent);color:var(--bg)}
.tablewrap{overflow-x:auto}
.verse{font-size:1.45rem;line-height:2.1;margin:8px 0}
.verse sup{font-family:var(--serif);font-size:.7rem;color:var(--muted);margin-right:4px}
.w{cursor:pointer;border-radius:5px;padding:0 2px;display:inline-block}
.w:hover,.w.sel{background:var(--accent-soft)}
.inter .w{display:inline-flex;flex-direction:column;align-items:center;margin:0 4px 10px;vertical-align:top;line-height:1.3}
.inter .w small{font-family:var(--serif);font-size:.7rem;color:var(--muted);max-width:110px;text-align:center}
.w small{display:none}.inter .w small{display:block}
.panel{position:sticky;bottom:12px;margin-top:14px;border-color:var(--accent)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.letter{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.letter .gk{font-size:2rem}
input[type=number],select,input[type=text]{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.list td{vertical-align:top}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line)}
.dot.l1{background:var(--bad)}.dot.l2{background:var(--warn)}.dot.l3{background:var(--good)}
.hide{display:none!important}
.pron{color:var(--muted);font-size:.95rem;margin:2px 0 6px;letter-spacing:.03em}
.pron b{color:var(--accent);font-weight:400;font-family:"Gentium Book Plus","Noto Serif","Times New Roman",serif}
.ipa{color:var(--accent);font-family:"Gentium Book Plus","Noto Serif",serif;font-size:1.05rem}
button.say{border-color:var(--accent);color:var(--accent);background:transparent;border-radius:50%;width:40px;height:40px;padding:0;font-size:1rem}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:.95rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.w.unk{text-decoration:underline dotted var(--accent);text-underline-offset:5px;color:var(--accent)}
.sbox{margin-top:12px;padding:12px;border-radius:10px;background:var(--accent-soft)}
a{color:var(--accent)}
.panel{max-height:70vh;overflow-y:auto}
.vgap{color:var(--muted);font-family:var(--serif);font-size:.8rem;border:1px dashed var(--line)}
sup.vnote{color:var(--accent);cursor:pointer}
@media (max-width:560px){
  .answers{grid-template-columns:1fr 1fr}
  .opts{grid-template-columns:1fr}
  .flash .big{font-size:2.1rem}
  .verse{font-size:1.25rem}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="logo gk" aria-hidden="true">αΩ</span>Koine Trainer</div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   DATA — paradigms (core morphology)
   ========================================================= */
const CASES=["Nom","Gen","Dat","Acc"];
function nounTable(id,title,info,sg,pl,voc){
  const cells=[];CASES.forEach((c,i)=>{cells.push({form:sg[i],label:c+" sg",r:i,c:0});cells.push({form:pl[i],label:c+" pl",r:i,c:1});});
  const rows=[...CASES]; if(voc){rows.push("Voc");cells.push({form:voc[0],label:"Voc sg",r:4,c:0});cells.push({form:voc[1],label:"Voc pl",r:4,c:1});}
  return {id,title,info,group:"Nouns",drill:id,rows,cols:["Singular","Plural"],cells};
}
function verbTable(id,title,info,drill,prefix,forms,group="Verbs"){
  const P=["1st","2nd","3rd"],cells=[];
  forms.forEach((f,i)=>cells.push({form:f,label:`${prefix} ${P[i%3]} ${i<3?"sg":"pl"}`,r:i%3,c:i<3?0:1}));
  return {id,title,info,group,drill,rows:P,cols:["Singular","Plural"],cells};
}
const PARADIGMS=[
 (()=>{const g=["masc","fem","neut"],F=[["ὁ","τοῦ","τῷ","τόν","οἱ","τῶν","τοῖς","τούς"],["ἡ","τῆς","τῇ","τήν","αἱ","τῶν","ταῖς","τάς"],["τό","τοῦ","τῷ","τό","τά","τῶν","τοῖς","τά"]];
   const cells=[];F.forEach((col,gi)=>col.forEach((f,i)=>cells.push({form:f,label:`${CASES[i%4]} ${i<4?"sg":"pl"} ${g[gi]}`,r:i%4,c:gi+(i<4?0:3)})));
   return {id:"art",title:"The article — ὁ, ἡ, τό",info:"Learn this first. It appears ~19,800 times and tells you the case, number and gender of the noun it goes with.",group:"Article",drill:"art",rows:CASES,cols:["M sg","F sg","N sg","M pl","F pl","N pl"],cells};})(),
 nounTable("n2m","2nd declension masc. — λόγος","The -ος pattern. θεός, κύριος, ἄνθρωπος, κόσμος, υἱός all follow it.",["λόγος","λόγου","λόγῳ","λόγον"],["λόγοι","λόγων","λόγοις","λόγους"],["λόγε","λόγοι"]),
 nounTable("n2n","2nd declension neut. — ἔργον","Neuter rule: nominative = accusative, and neuter plurals end in -α.",["ἔργον","ἔργου","ἔργῳ","ἔργον"],["ἔργα","ἔργων","ἔργοις","ἔργα"]),
 nounTable("n1a","1st declension fem. (η) — γραφή","The η-type. ζωή, ψυχή, φωνή, ἀγάπη (sg in η).",["γραφή","γραφῆς","γραφῇ","γραφήν"],["γραφαί","γραφῶν","γραφαῖς","γραφάς"]),
 nounTable("n1b","1st declension fem. (α) — ὥρα","After ε, ι, ρ the α stays: ἡμέρα, καρδία, ἁμαρτία, ἐκκλησία. Note ὥρας = gen sg OR acc pl.",["ὥρα","ὥρας","ὥρᾳ","ὥραν"],["ὧραι","ὡρῶν","ὥραις","ὥρας"]),
 nounTable("n3a","3rd declension — σάρξ","Find the stem from the genitive (σαρκ-ός). Endings: -, -ος, -ι, -α | -ες, -ων, -σι(ν), -ας.",["σάρξ","σαρκός","σαρκί","σάρκα"],["σάρκες","σαρκῶν","σαρξί(ν)","σάρκας"]),
 nounTable("n3n","3rd declension neut. — ὄνομα","The -μα, -ματος nouns: πνεῦμα, σῶμα, αἷμα, στόμα.",["ὄνομα","ὀνόματος","ὀνόματι","ὄνομα"],["ὀνόματα","ὀνομάτων","ὀνόμασι(ν)","ὀνόματα"]),
 verbTable("pai","Present active indicative — λύω","Ongoing / present action. Endings: -ω, -εις, -ει, -ομεν, -ετε, -ουσι(ν).","verb","Pres act ind",["λύω","λύεις","λύει","λύομεν","λύετε","λύουσι(ν)"]),
 verbTable("pmi","Present middle/passive indicative — λύω","Same forms for middle and passive in the present. Deponents (ἔρχομαι, γίνομαι) use these with active meaning.","verb","Pres mid/pass ind",["λύομαι","λύῃ","λύεται","λυόμεθα","λύεσθε","λύονται"]),
 verbTable("iai","Imperfect active indicative — λύω","Augment (ἐ-) + present stem = ongoing action in the past. Note ἔλυον = 1st sg AND 3rd pl.","verb","Impf act ind",["ἔλυον","ἔλυες","ἔλυε(ν)","ἐλύομεν","ἐλύετε","ἔλυον"]),
 verbTable("fai","Future active indicative — λύω","Present stem + σ + present endings.","verb","Fut act ind",["λύσω","λύσεις","λύσει","λύσομεν","λύσετε","λύσουσι(ν)"]),
 verbTable("aai","Aorist active indicative — λύω","The most common narrative tense. Augment + stem + σα. Simple past event.","verb","Aor act ind",["ἔλυσα","ἔλυσας","ἔλυσε(ν)","ἐλύσαμεν","ἐλύσατε","ἔλυσαν"]),
 verbTable("api","Aorist passive indicative — λύω","Augment + stem + θη. 'I was loosed.'","verb","Aor pass ind",["ἐλύθην","ἐλύθης","ἐλύθη","ἐλύθημεν","ἐλύθητε","ἐλύθησαν"]),
 verbTable("eimi","εἰμί — present","Irregular, but you will see it ~2,460 times. Memorise cold.","eimi","Pres ind",["εἰμί","εἶ","ἐστί(ν)","ἐσμέν","ἐστέ","εἰσί(ν)"],"εἰμί"),
 verbTable("eimi2","εἰμί — imperfect","ἦν ('was') — John 1:1 uses it three times.","eimi","Impf ind",["ἤμην","ἦς","ἦν","ἦμεν","ἦτε","ἦσαν"],"εἰμί"),
 nounTable("ego","Personal pronoun — ἐγώ / ἡμεῖς","Short forms (μου, μοι, με) are unemphatic; long forms (ἐμοῦ…) are emphatic.",["ἐγώ","μου / ἐμοῦ","μοι / ἐμοί","με / ἐμέ"],["ἡμεῖς","ἡμῶν","ἡμῖν","ἡμᾶς"]),
 nounTable("su","Personal pronoun — σύ / ὑμεῖς","Watch ἡμ- (we) vs ὑμ- (you pl). One letter apart, constantly confused.",["σύ","σου / σοῦ","σοι / σοί","σε / σέ"],["ὑμεῖς","ὑμῶν","ὑμῖν","ὑμᾶς"])
];
PARADIGMS.filter(p=>["ego","su"].includes(p.id)).forEach(p=>p.group="Pronouns");

/* =========================================================
   DATA — reader passages (word-by-word parsing)
   [form, lemma, gloss, parsing, note]
   ========================================================= */
const PASSAGES=[
{ id:"jn1", title:"John 1:1–5", translation:{

  verses:{

  2:[["οὗτος","οὗτος","this one / he","demonstrative pronoun, nominative singular masculine"],["ἦν","εἰμί","was","imperfect indicative 3rd sg"],["ἐν","ἐν","in","preposition (+dative)"],["ἀρχῇ","ἀρχή","beginning","noun, dative singular feminine"],["πρὸς","πρός","with","preposition (+accusative)"],["τὸν","ὁ","the","article, accusative singular masculine"],["θεόν.","θεός","God","noun, accusative singular masculine"]],
  3:[["πάντα","πᾶς","all things","adjective, nominative plural neuter","Neuter plural subject takes a singular verb (ἐγένετο) — a regular Greek rule."],["δι’","διά","through","preposition (+genitive)","διά drops its final α before a vowel (elision)."],["αὐτοῦ","αὐτός","him","personal pronoun, genitive singular masculine"],["ἐγένετο,","γίνομαι","came into being","aorist middle indicative 3rd sg","γίνομαι is middle in form, active in meaning (deponent). Contrast ἦν: the Word 'was', creation 'came to be'."],["καὶ","καί","and","conjunction"],["χωρὶς","χωρίς","without","preposition (+genitive)"],["αὐτοῦ","αὐτός","him","personal pronoun, genitive singular masculine"],["ἐγένετο","γίνομαι","came into being","aorist middle indicative 3rd sg"],["οὐδὲ","οὐδέ","not even","conjunction / adverb"],["ἕν.","εἷς","one (thing)","adjective/numeral, nominative singular neuter"],["ὃ","ὅς","which, that","relative pronoun, nominative singular neuter"],["γέγονεν.","γίνομαι","has come into being","perfect active indicative 3rd sg","Perfect = completed action with lasting result."]],
  4:[["ἐν","ἐν","in","preposition (+dative)"],["αὐτῷ","αὐτός","him","personal pronoun, dative singular masculine"],["ζωὴ","ζωή","life","noun, nominative singular feminine"],["ἦν,","εἰμί","was","imperfect indicative 3rd sg"],["καὶ","καί","and","conjunction"],["ἡ","ὁ","the","article, nominative singular feminine"],["ζωὴ","ζωή","life","noun, nominative singular feminine"],["ἦν","εἰμί","was","imperfect indicative 3rd sg"],["τὸ","ὁ","the","article, nominative singular neuter"],["φῶς","φῶς","light","noun, nominative singular neuter"],["τῶν","ὁ","the","article, genitive plural masculine"],["ἀνθρώπων·","ἄνθρωπος","of men / of people","noun, genitive plural masculine"]],
  5:[["καὶ","καί","and","conjunction"],["τὸ","ὁ","the","article, nominative singular neuter"],["φῶς","φῶς","light","noun, nominative singular neuter"],["ἐν","ἐν","in","preposition (+dative)"],["τῇ","ὁ","the","article, dative singular feminine"],["σκοτίᾳ","σκοτία","darkness","noun, dative singular feminine"],["φαίνει,","φαίνω","shines","present active indicative 3rd sg","Present: it keeps on shining."],["καὶ","καί","and","conjunction"],["ἡ","ὁ","the","article, nominative singular feminine"],["σκοτία","σκοτία","darkness","noun, nominative singular feminine"],["αὐτὸ","αὐτός","it","personal pronoun, accusative singular neuter","Neuter because it refers back to τὸ φῶς."],["οὐ","οὐ","not","negative particle"],["κατέλαβεν.","καταλαμβάνω","overcame / grasped","aorist active indicative 3rd sg","Second aorist of καταλαμβάνω. Can mean 'seize/overcome' or 'comprehend' — John likely plays on both."]]

  verses:{16:[["Οὕτως","οὕτω(ς)","in this way, so","adverb","Means 'in this manner' more than 'so much': God loved the world in this way — by giving."],["γὰρ","γάρ","for","conjunction (postpositive)","Never first in its clause."],["ἠγάπησεν","ἀγαπάω","loved","aorist active indicative 3rd sg"],["ὁ","ὁ","the","article, nominative singular masculine"],["θεὸς","θεός","God","noun, nominative singular masculine"],["τὸν","ὁ","the","article, accusative singular masculine"],["κόσμον,","κόσμος","world","noun, accusative singular masculine"],["ὥστε","ὥστε","so that","conjunction (result)"],["τὸν","ὁ","the","article, accusative singular masculine"],["υἱὸν","υἱός","Son","noun, accusative singular masculine","Textual variant: many manuscripts, including the Greek text behind the KJV, read τὸν υἱὸν αὐτοῦ, 'his Son'. The SBLGNT and NA28 follow the earliest manuscripts, which lack αὐτοῦ."],["τὸν","ὁ","the","article, accusative singular masculine"],["μονογενῆ","μονογενής","one and only, unique","adjective, accusative singular masculine","Third-declension adjective. Literally 'one of a kind'."],["ἔδωκεν,","δίδωμι","gave","aorist active indicative 3rd sg","κ-aorist of δίδωμι."],["ἵνα","ἵνα","so that","conjunction (purpose)","Takes the subjunctive: ἀπόληται, ἔχῃ."],["πᾶς","πᾶς","everyone","adjective, nominative singular masculine"],["ὁ","ὁ","the (one)","article, nominative singular masculine"],["πιστεύων","πιστεύω","believing","present active participle, nominative singular masculine","Article + participle = 'the one who believes'. Present: ongoing believing."],["εἰς","εἰς","into, in","preposition (+accusative)","πιστεύω εἰς — characteristic of John: faith directed into a person."],["αὐτὸν","αὐτός","him","personal pronoun, accusative singular masculine"],["μὴ","μή","not","negative particle","μή, not οὐ, because the verb is subjunctive."],["ἀπόληται","ἀπόλλυμι","perish","aorist middle subjunctive 3rd sg"],["ἀλλὰ","ἀλλά","but","conjunction","SBLGNT prints ἀλλὰ here; NA28 has the elided form ἀλλ’. Same word."],["ἔχῃ","ἔχω","have","present active subjunctive 3rd sg"],["ζωὴν","ζωή","life","noun, accusative singular feminine"],["αἰώνιον.","αἰώνιος","eternal","adjective, accusative singular feminine","Two-termination adjective: the -ον form is used for both masculine and feminine."]]}
},
{ id:"1jn48", title:"1 John 4:8", translation:{8:"The one who does not love has not known God, because God is love."},
  verses:{8:[["ὁ","ὁ","the (one)","article, nominative singular masculine"],["μὴ","μή","not","negative particle","Participles are negated with μή."],["ἀγαπῶν","ἀγαπάω","loving","present active participle, nominative singular masculine","Contract verb: ἀγαπα + ων → ἀγαπῶν."],["οὐκ","οὐ","not","negative particle","οὐκ before a vowel."],["ἔγνω","γινώσκω","knew, has known","aorist active indicative 3rd sg","Root aorist of γινώσκω."],["τὸν","ὁ","the","article, accusative singular masculine"],["θεόν,","θεός","God","noun, accusative singular masculine"],["ὅτι","ὅτι","because","conjunction"],["ὁ","ὁ","the","article, nominative singular masculine"],["θεὸς","θεός","God","noun, nominative singular masculine"],["ἀγάπη","ἀγάπη","love","noun, nominative singular feminine","Anarthrous predicate: love is what God is in his nature — not 'love is God'."],["ἐστίν.","εἰμί","is","present indicative 3rd sg"]]}
}
];

const ALPHABET=[
["Α α","alpha","a","a in 'father'"],["Β β","beta","b","b"],["Γ γ","gamma","g","hard g; γγ/γκ = 'ng'"],["Δ δ","delta","d","d"],

["Ι ι","iota","i","i in 'machine' / 'it'"],["Κ κ","kappa","k","k"],["Λ λ","lambda","l","l"],["Μ μ","mu","m","m"],
["Ν ν","nu","n","n"],["Ξ ξ","xi","x","x in 'box'"],["Ο ο","omicron","o","short o in 'not'"],["Π π","pi","p","p"],
["Ρ ρ","rho","r","rolled r (as in Italian)"],["Σ σ ς","sigma","s","s — ς only at word end"],["Τ τ","tau","t","t"],["Υ υ","upsilon","u / y","German ü"],
["Φ φ","phi","ph","f"],["Χ χ","chi","ch","German 'ch' in 'Bach'"],["Ψ ψ","psi","ps","ps in 'lips'"],["Ω ω","omega","ō","long o in 'tone'"]
];
const DIPH=[["αι","ai","'aisle'"],["ει","ei","'eight'"],["οι","oi","'oil'"],["αυ","au","'how' / German 'Haus'"],["ου","ou","'soup'"],["ευ, ηυ","eu","'feud'"],["υι","ui","'suite'"]];

/* =========================================================
   LEXICON — loaded from data/ (built by tools/build_nt.py)
   lemma row: [lemma, lexical form, gloss, NT count, POS, Strong's #]
   ========================================================= */
let LEX=[],LEXI={},NT_WORDS=137554,STRONGS=null,BOOKS=[],BOOKDATA={};
const POSN={"A-":"adjective","C-":"conjunction","D-":"adverb","I-":"interjection","N-":"noun","P-":"preposition","RA":"article","RD":"demonstrative pronoun","RI":"interrogative / indefinite pronoun","RP":"personal pronoun","RR":"relative pronoun","V-":"verb","X-":"particle"};
const TENSE={P:"present",I:"imperfect",F:"future",A:"aorist",X:"perfect",Y:"pluperfect"},VOICE={A:"active",M:"middle",P:"passive"},
 MOOD={I:"indicative",D:"imperative",S:"subjunctive",O:"optative",N:"infinitive",P:"participle"},CASE={N:"nominative",G:"genitive",D:"dative",A:"accusative",V:"vocative"},
 NUM={S:"singular",P:"plural"},GEN={M:"masculine",F:"feminine",N:"neuter"},DEG={C:"comparative",S:"superlative"},PERS={1:"1st person",2:"2nd person",3:"3rd person"};
function parseCode(code,lemma){
  const pos=code.slice(0,2),p=code.slice(2),out=[];
  const cng=[CASE[p[4]],NUM[p[5]],GEN[p[6]]].filter(Boolean).join(" ");
  if(pos==="V-"){
    const tvm=[TENSE[p[1]],VOICE[p[2]],MOOD[p[3]]].filter(Boolean).join(" ");
    let s="verb, "+tvm;
    if(p[3]==="P")s+=(cng?", "+cng:"");
    else if(p[3]!=="N"&&PERS[p[0]])s+=", "+PERS[p[0]]+" "+(NUM[p[5]]||"");
    if(/μαι$/.test(lemma)&&(p[2]==="M"||p[2]==="P"))s+=" · this verb is middle/passive in form but usually active in meaning (deponent)";
    return s;
  }
  out.push(POSN[pos]||pos);
  if(cng)out.push(cng);
  if(DEG[p[7]])out.push(DEG[p[7]]);
  if(PERS[p[0]]&&pos==="RP")out[0]+=" ("+PERS[p[0]]+")";
  return out.join(", ");
}
const short=g=>(g||"").split(/[;]/)[0].replace(/^\((?:act|mid|pl)\.\)\s*/,"").split(",").slice(0,2).join(",").trim();
const bare=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ς/g,"σ");

/* transliteration (SBL academic style) */
function translit(w){
  const d=w.normalize("NFD");let out="",rough=false,first=true,cap=false;
  const L={α:"a",β:"b",γ:"g",δ:"d",ε:"e",ζ:"z",η:"ē",θ:"th",ι:"i",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"x",ο:"o",π:"p",ρ:"r",σ:"s",ς:"s",τ:"t",υ:"y",φ:"ph",χ:"ch",ψ:"ps",ω:"ō"};
  const chars=[];for(const ch of d){if(/[\u0300-\u036f]/.test(ch)){if(chars.length)chars[chars.length-1].m+=ch;}else chars.push({c:ch,m:""});}
  chars.forEach((o,i)=>{
    const lc=o.c.toLowerCase();if(!(lc in L)){out+=o.c;return;}
    if(i===0&&o.c!==lc)cap=true;
    if(o.m.includes("\u0314")){ if(lc==="ρ"){out+="rh";return;} rough=true; }
    let t=L[lc];
    if(lc==="γ"&&chars[i+1]&&"γκξχ".includes(chars[i+1].c.toLowerCase()))t="n";
    if(lc==="υ"&&!o.m.includes("\u0308")&&i>0&&"αεηο".includes(chars[i-1].c.toLowerCase()))t="u";
    if(lc==="υ"&&chars[i+1]&&chars[i+1].c.toLowerCase()==="ι"&&!(i>0&&"αεηο".includes(chars[i-1].c.toLowerCase())))t="u";
    out+=t;
  });
  if(rough)out="h"+out;
  return cap?out.charAt(0).toUpperCase()+out.slice(1):out;
}

/* ---------- Pronunciation ----------

   Written guide: Erasmian syllables, stressed syllable in capitals. */
const sayable=t=>t.split(",")[0].replace(/[⸀⸁⸂⸃⸄⸅⟦⟧\[\]()\-.,·;’\d]/g,"").trim();
let greekVoice=null;
function findVoice(){try{const vs=speechSynthesis.getVoices();greekVoice=vs.find(v=>/^el/i.test(v.lang))||null;}catch(e){}return greekVoice;}
try{findVoice();speechSynthesis.onvoiceschanged=findVoice;}catch(e){}
function toast(html,ms=6000){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.innerHTML=html;t.className="show";clearTimeout(t._h);t._h=setTimeout(()=>t.className="",ms);}
function speak(text){
  const w=sayable(text);if(!w)return;
  if(!("speechSynthesis" in window)){toast("This browser can't play speech. Use the IPA guide under the word (ˈ marks the stressed syllable).");return;}
  if(!greekVoice)findVoice();
  try{const u=new SpeechSynthesisUtterance(w);u.lang="el-GR";if(greekVoice)u.voice=greekVoice;u.rate=.75;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
  if(!greekVoice)setTimeout(()=>{if(!findVoice())toast("No Greek voice found on this device. <b>iPhone:</b> Settings → Accessibility → Spoken Content → Voices → Greek, then download one. <b>Android:</b> Settings → Text-to-speech → install Greek.",9000);},600);
}
/* IPA, Erasmian values (as taught in the Alphabet tab) */
const PRON_V={α:"a",ε:"e",η:"eː",ι:"i",ο:"o",υ:"y",ω:"oː"};
const PRON_D={αι:"ai̯",ει:"ei̯",οι:"oi̯",ου:"uː",αυ:"au̯",ευ:"eu̯",ηυ:"eːu̯",υι:"yi̯"};
const PRON_C={β:"b",γ:"g",δ:"d",ζ:"dz",θ:"θ",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"ks",π:"p",ρ:"r",σ:"s",ς:"s",τ:"t",φ:"f",χ:"x",ψ:"ps"};
const ONSETS=new Set(["βλ","βρ","γλ","γρ","γν","δρ","θλ","θρ","θν","κλ","κρ","κν","κτ","πλ","πρ","πν","πτ","τρ","φλ","φρ","χλ","χρ","χθ","φθ","μν","σβ","σθ","σκ","σμ","σπ","στ","σφ","σχ","σκλ","στρ","σπλ","σκρ"]);
function pron(word){
  const d=sayable(word).normalize("NFD");if(!d)return "";
  const ch=[];for(const c of d){if(/[\u0300-\u036f\u0342\u0345]/.test(c)){if(ch.length)ch[ch.length-1].m+=c;}else ch.push({c:c.toLowerCase(),m:""});}
  const units=[];let rough=false;
  for(let i=0;i<ch.length;i++){
    const a=ch[i],b=ch[i+1];
    if(a.m.includes("\u0314")&&a.c!=="ρ")rough=true;
    if(b&&PRON_D[a.c+b.c]&&!b.m.includes("\u0308")){
      if(b.m.includes("\u0314"))rough=true;
      units.push({v:true,t:PRON_D[a.c+b.c],acc:/[\u0301\u0300\u0342]/.test(a.m+b.m),h:/\u0314/.test(a.m+b.m)});i++;continue;}
    if(PRON_V[a.c])units.push({v:true,t:PRON_V[a.c],acc:/[\u0301\u0300\u0342]/.test(a.m),h:a.m.includes("\u0314")});
    else if(PRON_C[a.c]){let t=PRON_C[a.c];if(a.c==="γ"&&b&&"γκξχ".includes(b.c))t="ŋ";units.push({v:false,g:a.c,t});}
  }
  const vi=units.map((u,i)=>u.v?i:-1).filter(i=>i>=0);if(!vi.length)return "/"+units.map(u=>u.t).join("")+"/";
  const sylls=[];let start=0;
  for(let k=0;k<vi.length;k++){
    const end=k+1<vi.length?(()=>{const cl=units.slice(vi[k]+1,vi[k+1]);if(cl.length<=1)return vi[k]+1;
      const g=cl.map(u=>u.g).join("");if(ONSETS.has(g))return vi[k]+1;
      const rest=cl.slice(1).map(u=>u.g).join("");return vi[k]+2+(rest.length>1&&!ONSETS.has(rest)?rest.length-1:0);})():units.length;
    sylls.push(units.slice(start,end));start=end;}
  const parts=sylls.map(sy=>sy.map(u=>u.t).join(""));
  if(rough)parts[0]="h"+parts[0];
  const st=sylls.length>1?sylls.findIndex(sy=>sy.some(u=>u.acc)):-1;
  return "/"+parts.map((t,i)=>(i===st?"ˈ":i>0?".":"")+t).join("")+"/";
}

function wordCard(lemma,extra){
  const i=LEXI[lemma];if(i===undefined)return `<p class="muted">No entry found.</p>`;
  const r=LEX[i],c=S.cards[lemma];
  const status=!c?`<button class="small" data-add="${esc(lemma)}">+ Add to my reviews</button>`:`<span class="tag">${c.box>=3?"solid":"learning"} · in your reviews</span>`;
  return `${extra||""}
   <div class="row" style="justify-content:space-between;align-items:baseline"><span class="gk" style="font-size:1.5rem">${esc(r[1])}</span><span class="muted small">${esc(translit(lemma))}</span></div>
   <div class="pron"><b>${esc(pron(lemma))}</b></div>
   <div style="margin:4px 0"><b>${esc(r[2]||"(no short gloss; see Strong's below)")}</b></div>
   <div class="muted small">${POSN[r[4]]||""} · ${r[3].toLocaleString()}× in NT · frequency rank #${i+1}</div>
   <div class="row" style="margin-top:8px">${status}<button class="ghost small" data-say="${esc(lemma)}">🔊</button></div>
   <div class="strongs" data-sn="${r[5]}">${r[5]?`<p class="muted small">Loading Strong's ${r[5]}…</p>`:`<p class="muted small">No Strong's entry. Strong's (1890) was keyed to the KJV's Greek text, and this word or spelling isn't in it.</p>`}</div>`;
}
function strongsHTML(sn){
  const e=STRONGS[sn];if(!e)return "";
  const link=s=>esc(s).replace(/G(\d+)/g,(m)=>`<a href="#" data-sn-link="${m}">${m}</a>`);
  return `<div class="sbox"><div class="row" style="justify-content:space-between"><b>Strong's ${sn}</b><span class="gk">${esc(e[0])}</span></div>
   <div class="small muted">${esc(e[1])}</div>
   ${(e[4]||e[2])?`<p class="small" style="margin:6px 0">${link([e[4],e[2]].filter(Boolean).join(" ").replace(/\s+/g," ").trim())}</p>`:""}
   ${e[3]?`<p class="small" style="margin:6px 0"><b>KJV renderings:</b> ${esc(e[3])} <span class="muted">(how the KJV translators rendered this word, not a definition)</span></p>`:""}</div>`;
}
async function hydrate(root){
  root.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{addCard(b.dataset.add);b.outerHTML=`<span class="tag">added: it's in today's reviews</span>`;});
  root.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const boxes=[...root.querySelectorAll(".strongs[data-sn]")].filter(b=>b.dataset.sn);
  if(!boxes.length)return;
  try{await loadStrongs();}catch(e){boxes.forEach(b=>b.innerHTML=`<p class="muted small">Couldn't load Strong's (are you offline?).</p>`);return;}
  boxes.forEach(b=>{b.innerHTML=strongsHTML(b.dataset.sn);});
  root.querySelectorAll("[data-sn-link]").forEach(a=>a.onclick=e=>{e.preventDefault();dictQuery=a.dataset.snLink;dictSel=null;go("dict");});
}

let formSel="art",drillQ=null,drillMode="drill",streakRun=0;
function tableHTML(p,hl){
  const grid=p.rows.map(()=>p.cols.map(()=>""));p.cells.forEach(c=>grid[c.r][c.c]=c);
  return `<div class="tablewrap"><table><thead><tr><th></th>${p.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${
    p.rows.map((r,ri)=>`<tr><th>${r}</th>${grid[ri].map(c=>`<td class="gk ${c&&hl&&hl.includes(c.label)?"hl":""}">${c?esc(c.form):""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function newQ(){
  const p0=PARADIGMS.find(x=>x.id===formSel),pool=PARADIGMS.filter(x=>x.drill===p0.drill),all=pool.flatMap(p=>p.cells.map(c=>Object.assign({p},c)));
  const q=all[Math.floor(Math.random()*all.length)];
  const valid=all.filter(c=>c.form===q.form).map(c=>c.label);
  const labels=[...new Set(all.map(c=>c.label))].filter(l=>!valid.includes(l));
  const key=q.label.split(" ").slice(0,-2).join(" ");
  const near=shuffle(labels.filter(l=>l.startsWith(key))),far=shuffle(labels.filter(l=>!l.startsWith(key)));
  drillQ={q,valid,opts:shuffle([q.label,...[...near.slice(0,2),...far].slice(0,3)]),answered:null,poolId:p0.drill};
}
function viewForms(){
  const p=PARADIGMS.find(x=>x.id===formSel),groups=[...new Set(PARADIGMS.map(x=>x.group))];

  let body="";

  else{

    body=`<div class="card flash">

      <div class="opts">${d.opts.map(o=>`<button data-o="${esc(o)}" class="${d.answered?(d.valid.includes(o)?"right":(o===d.answered?"wrong":"")):""}">${esc(o)}</button>`).join("")}</div>
      ${d.answered?`<div style="margin-top:16px">${d.valid.includes(d.answered)?`<b style="color:var(--good)">Correct</b>`:`<b style="color:var(--bad)">Not quite.</b> It's <b>${esc(d.valid.join(" or "))}</b>`}
        ${d.valid.length>1?`<p class="muted small">This form is ambiguous; in a real text the context decides.</p>`:""}
        <div style="margin-top:12px">${tableHTML(d.q.p,d.valid)}</div>
        <button class="primary" id="next" style="margin-top:14px">Next <span class="small">(Enter)</span></button></div>`:""}
      <p class="muted small" style="margin-top:14px">Run: ${streakRun} in a row · overall ${S.drill.total?Math.round(S.drill.right/S.drill.total*100):0}% of ${S.drill.total}</p></div>`;

  $("#app").innerHTML=`<h2>Forms</h2>

async function showResults(){

    else if(/[\u0370-\u03ff\u1f00-\u1fff]/.test(q)){const b=bare(q);hits=LEX.filter(r=>bare(r[0]).startsWith(b)||bare(r[1]).startsWith(b));}

/* =========================================================
   ALPHABET — letters (tracked to mastery) + sound-it-out drill
   ========================================================= */
let alphaQ=null,alphaMode="letters";
function pickLetter(){const w=ALPHABET.map((_,i)=>Math.max(1,ALPHA_DONE+1-(S.alpha[i]||0))*(i<=lettersUnlocked()?1:0));
  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}return 0;}
function lettersUnlocked(){let n=5;for(let i=0;i<24;i+=6){const grp=ALPHABET.slice(0,n+1).every((_,k)=>(S.alpha[k]||0)>=ALPHA_DONE);if(grp)n=Math.min(23,n+6);}return n;}
function newAlphaQ(){
  if(alphaMode==="letters"){const i=pickLetter();const pool=[...Array(lettersUnlocked()+1).keys()].filter(x=>x!==i);
    alphaQ={i,opts:shuffle([i,...shuffle(pool.length>=3?pool:[...Array(24).keys()].filter(x=>x!==i)).slice(0,3)]),ans:null};}
  else{const top=LEX.slice(0,400).filter(r=>r[0].length>2&&!/[A-ZΑ-Ω\u1f08-\u1f6f]/.test(r[0][0]));
    const w=top[Math.floor(Math.random()*top.length)];const t=translit(w[0]);
    const others=shuffle(top.filter(r=>r!==w&&Math.abs(translit(r[0]).length-t.length)<=2)).slice(0,3).map(r=>translit(r[0]));
    alphaQ={w,t,opts:shuffle([t,...others]),ans:null};}
}
function viewAlpha(){
  if(!alphaQ||alphaQ.mode!==alphaMode){newAlphaQ();alphaQ.mode=alphaMode;}
  const a=alphaQ,ak=alphaKnown();
  let quiz;
  if(alphaMode==="letters"){
    quiz=`<div class="muted small">Which letter is this?</div><div class="big gk">${ALPHABET[a.i][0].split(" ").slice(1).join(" ")}</div>
    <div class="opts">${a.opts.map(o=>`<button data-a="${o}" class="${a.ans!==null?(o===a.i?"right":(o===a.ans?"wrong":"")):""}">${ALPHABET[o][1]} (${ALPHABET[o][2]})</button>`).join("")}</div>`;
  }else{
    quiz=`<div class="muted small">Sound it out. Which transliteration matches?</div><div class="big gk">${esc(a.w[0])}</div>
    <div class="opts">${a.opts.map(o=>`<button data-a="${esc(o)}" class="${a.ans!==null?(o===a.t?"right":(o===a.ans?"wrong":"")):""}">${esc(o)}</button>`).join("")}</div>
    ${a.ans!==null?`<p>It means <b>${esc(a.w[2])}</b> (${a.w[3]}× in NT)</p>`:""}`;
  }
  $("#app").innerHTML=`<h2>Alphabet & pronunciation</h2>
  <div class="row" style="margin-bottom:12px"><button class="small ${alphaMode==="letters"?"on":""}" id="aL">Letters</button><button class="small ${alphaMode==="words"?"on":""}" id="aW">Sound it out (real words)</button></div>
  <div class="card"><div class="row" style="justify-content:space-between"><b>${ak} / 24 letters learned</b><span class="muted small">${ak<24?`New letters unlock in groups of 6 as you learn them`:`Alphabet done ✓ Move on to Vocab`}</span></div><div class="bar" style="margin-top:8px"><i style="width:${ak/24*100}%"></i></div></div>
  <div class="card flash">${quiz}${a.ans!==null?`<button class="primary" id="an" style="margin-top:14px">Next</button>`:""}</div>
  <div class="letters">${ALPHABET.map((l,i)=>`<div class="letter" style="${(S.alpha[i]||0)>=ALPHA_DONE?"border-color:var(--good)":""}"><div class="gk">${l[0]}</div><b>${l[1]}</b><div class="ipa">/${PRON_V[l[0].slice(-1)]||PRON_C[l[0].split(" ")[1][0]]}/</div><div class="small muted">${l[3]}</div></div>`).join("")}</div>
  <h3>Diphthongs</h3><div class="letters">${DIPH.map(d=>`<div class="letter"><div class="gk">${d[0]}</div><div class="ipa">/${PRON_D[d[0].slice(0,2)]}/</div><div class="small muted">${d[2]}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:14px"><b>Marks</b>
   <p><span class="gk" style="font-size:1.3rem">ἁ</span> rough breathing = an "h" sound (ἁμαρτία → <i>hamartia</i>). <span class="gk" style="font-size:1.3rem">ἀ</span> smooth breathing = no sound.</p>
   <p><span class="gk" style="font-size:1.3rem">ᾳ ῃ ῳ</span> iota subscript: silent, but it often marks the <b>dative</b> (λόγῳ, ἀρχῇ). Watch for it.</p>
   <p><span class="gk" style="font-size:1.3rem">ά ὰ ᾶ</span> accents mark the stressed syllable, and sometimes tell two words apart (τίς "who?" vs τις "someone").</p>
   <p class="muted small">Pronunciation here is <b>Erasmian</b>, the standard academic system. The 🔊 button uses your device's Greek voice, which speaks <b>modern</b> Greek: η, ι, υ, ει, οι all sound like "i", β sounds like "v", and δ like the "th" in "this". Use it for rhythm and stress, and follow the IPA guide (Erasmian) shown under each word for the sounds: <b>ˈ</b> comes before the stressed syllable, <b>.</b> separates syllables, and <b>ː</b> marks a long vowel.</p></div>`;
  $("#aL").onclick=()=>{alphaMode="letters";viewAlpha();};$("#aW").onclick=()=>{alphaMode="words";viewAlpha();};
  $("#app").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(a.ans!==null)return;
    if(alphaMode==="letters"){a.ans=+b.dataset.a;S.alpha[a.i]=a.ans===a.i?(S.alpha[a.i]||0)+1:0;touchStreak();save();}
    else a.ans=b.dataset.a;
    viewAlpha();});
  const n=$("#an");if(n){n.onclick=()=>{newAlphaQ();alphaQ.mode=alphaMode;viewAlpha();};n.focus();}
}

/* =========================================================
   METHOD
   ========================================================= */
function viewMethod(){
  $("#app").innerHTML=`<h2>The method</h2>
  <div class="card"><p>There is no secret spy trick. What the US government language schools (the CIA's language school, the State Department's FSI, the military's DLI) do is <b>intensive, structured and relentless</b>: lots of time on task, the most useful material first, constant testing, and real texts early. This trainer copies that structure.</p></div>
  <div class="card"><h3 style="margin-top:0">0 · Alphabet first (days 1–3)</h3><p>Don't skip it. Learn the 24 letters until you can sound out any word, then start vocabulary. Trying to memorise words you can't read is slow and frustrating.</p>
  <h3>1 · Frequency first</h3><p>The top 100 words make up about two thirds of the words in the NT text, and the top 320 about 80%. Learn them in frequency order and you can read real verses within weeks.</p>
  <h3>2 · Spaced repetition</h3><p>Each card comes back just before you would forget it (1 → 2 → 4 → 8 → 16… days). Ten to fifteen minutes a day beats two hours on a Sunday.</p>
  <h3>3 · Drill the forms until they're automatic</h3><p>Greek packs its meaning into word endings. Military schools drill these patterns until you recognise them without thinking. Recognising a form in under 2 seconds is the goal.</p>
  <h3>4 · Read real text from day one</h3><p>The whole NT is in the Read tab. Start with John's Gospel and 1 John: they use the simplest vocabulary in the NT. Turn on "Mark words I don't know" and watch the marked words thin out over the weeks.</p>
  <h3>5 · Say it out loud</h3><p>Read aloud, chant the charts, explain a verse to someone. Producing the language beats only recognising it.</p></div>
  <div class="card"><h3 style="margin-top:0">A 12-week plan</h3>
  <table><tr><th>Weeks</th><th>Focus</th><th>Milestone</th></tr>
  <tr><td>1</td><td>Alphabet (days 1–3), article, first 50 words</td><td>Sound out John 1:1 and parse it</td></tr>
  <tr><td>2–3</td><td>2nd & 1st declension, εἰμί, present active, words to 150</td><td>John 1:1–5 without help</td></tr>
  <tr><td>4–5</td><td>3rd declension, pronouns, imperfect, future</td><td>1 John 1 with the reader</td></tr>
  <tr><td>6–8</td><td>Aorist (active/passive), middle voice, words to 320 (80% coverage)</td><td>John 3 and 1 John 4 with few taps</td></tr>
  <tr><td>9–12</td><td>Participles, subjunctive, infinitives</td><td>A chapter of John a week</td></tr></table></div>
  <div class="card"><h3 style="margin-top:0">Sources & accuracy</h3>
  <p class="small">• <b>Greek text:</b> SBL Greek New Testament (SBLGNT), © 2010 Society of Biblical Literature and Logos Bible Software.<br>
  • <b>Parsing & dictionary forms:</b> MorphGNT (James Tauber et al., CC BY-SA). One correction applied: MorphGNT lists δεῖ, δέω and δέομαι together under δέω; here they are separated.<br>
  • <b>Glosses:</b> Dodson Greek Lexicon (public domain), with hand-checked glosses for the ~260 most common and most-needed words.<br>
  • <b>Strong's:</b> Strong's Greek Dictionary (1890), via Open Scriptures (CC BY-SA). Its "KJV renderings" line lists how the KJV translated a word; it is not a definition. Strong's numbers follow the KJV's Greek text, so a few SBLGNT words and spellings have none.<br>
  • <b>Charts and guided notes:</b> written by hand to standard Koine grammar.</p>
  <p class="small muted">For serious study, check against Mounce's <i>Basics of Biblical Greek</i> and the BDAG lexicon.</p></div>`;
}
